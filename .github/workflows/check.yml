name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats jq parallel ripgrep shellcheck
      # `claude plugin validate` reads only the local manifests; no login needed.
      - name: Install Claude Code
        run: npm install --global --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.332
      - name: Run checks
        run: make check
